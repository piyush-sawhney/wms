name: CI Release + Dev Docker Image

# runs on these branches
on:
  push:
    branches:
      - develop
      - dev-release
      - prod-release
  workflow_dispatch:

# give the workflow write permissions to repo contents (needed for pushing)
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      release_version: ${{ steps.get_version.outputs.release-version }}

    steps:
      - name: Checkout repository (use PAT)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}     # <<< important: make checkout use the PAT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}   # <<< important: semantic-release reads GITHUB_TOKEN
        run: |
          # run semantic-release normally
          npx semantic-release

      - name: Get released version (latest tag)
        id: get_version
        run: |
          # fetch tags created by semantic-release
          git fetch --tags

          # get latest tag (semantic-release prefixes tags with "v" by default)
          TAG=$(git describe --tags --abbrev=0 || true)

          if [ -z "$TAG" ]; then
            echo "No release tag found."
            echo "release-version=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # strip leading `v` if present
          VERSION=${TAG#v}
          echo "Found tag: $TAG -> version: $VERSION"
          echo "release-version=$VERSION" >> $GITHUB_OUTPUT

  docker:
    runs-on: ubuntu-latest
    needs: release
    # only run Docker build on dev-release branch
    if: github.ref == 'refs/heads/dev-release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}   # optional, but safe if you need to read repo content

      - name: Encode apps.json to base64
        run: |
          echo "APPS_JSON_BASE64=$(base64 -w 0 docker/dev/apps.json)" >> $GITHUB_ENV

      - name: Validate apps.json
        run: |
          echo "${{ env.APPS_JSON_BASE64 }}" | base64 -d > updated_apps.json
          jq empty updated_apps.json

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No release version found, skipping docker build."
            exit 0
          fi

          echo "Building image for version: $VERSION"

          git clone https://github.com/frappe/frappe_docker

          docker build \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/wms:${VERSION} \
            --file=frappe_docker/images/layered/Containerfile \
            frappe_docker

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wms:${VERSION}
