name: Docker Image CI

on:
  push:
    branches: [ "dev-release" ]
  pull_request:
  workflow_dispatch:
    

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Encode apps.json as base64 and set environment variable
      - name: Encode apps.json to base64
        run: |
          echo "APPS_JSON_BASE64=$(base64 -w 0 docker/dev/apps.json)" >> $GITHUB_ENV

      # 3️⃣ Validate apps.json using jq
      - name: Validate apps.json
        run: |
          echo "${{ env.APPS_JSON_BASE64 }}" | base64 -d > updated_apps.json
          jq empty updated_apps.json

      # 4️⃣ Log in to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Build and push Docker image
      - name: Build and Push Docker Image
        run: |
          git clone https://github.com/frappe/frappe_docker
          docker build \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/wms:dev \
            --file=frappe_docker/images/layered/Containerfile \
            frappe_docker
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wms:dev

